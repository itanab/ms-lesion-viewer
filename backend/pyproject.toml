[project]
name = "ms-lesion-viewer-backend"
version = "0.1.0"
description = "Neuro AI - MS Lesion Viewer: research POC backend"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "python-multipart>=0.0.9",
  "pydantic>=2.6,<3",
  "numpy>=1.26,<3",
  "nibabel>=5.2,<6",
  "scipy>=1.12,<2",
  "pillow>=10.3",
]

[project.optional-dependencies]
# Heavy model dependencies live here (or in the worker image), never in the base install.
inference = ["torch", "monai"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
include = ["app*"]
